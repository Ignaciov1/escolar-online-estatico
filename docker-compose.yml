# CleanMarket Fintech SpA - Docker Compose Local (Solo microservicios CRUD EKS)
services:
  db:
    image: mysql:8.0
    container_name: cleanmarket-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno123
      MYSQL_DATABASE: cleanmarket
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cleanmarket-net

  get-products:
    build: ./microserviciosEKSBackend/get-products
    container_name: cleanmarket-get-products
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: alumno
      DB_PASS: alumno123
      DB_NAME: cleanmarket
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cleanmarket-net

  create-product:
    build: ./microserviciosEKSBackend/create-product
    container_name: cleanmarket-create-product
    ports:
      - "3002:3002"
    environment:
      DB_HOST: db
      DB_USER: alumno
      DB_PASS: alumno123
      DB_NAME: cleanmarket
      PORT: 3002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cleanmarket-net

  update-product:
    build: ./microserviciosEKSBackend/update-product
    container_name: cleanmarket-update-product
    ports:
      - "3003:3003"
    environment:
      DB_HOST: db
      DB_USER: alumno
      DB_PASS: alumno123
      DB_NAME: cleanmarket
      PORT: 3003
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cleanmarket-net

  delete-product:
    build: ./microserviciosEKSBackend/delete-product
    container_name: cleanmarket-delete-product
    ports:
      - "3004:3004"
    environment:
      DB_HOST: db
      DB_USER: alumno
      DB_PASS: alumno123
      DB_NAME: cleanmarket
      PORT: 3004
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cleanmarket-net

volumes:
  mysql_data:

networks:
  cleanmarket-net:
    driver: bridge